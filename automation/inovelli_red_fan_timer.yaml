blueprint:
  name: Inovelli Red VZW30 Fan Preset Timer
  description: >
    Replace the VZW30-SN firmware fan timer with a Home Assistant timer.
    Each paddle-up press advances through five run-time presets and refills a
    seven-segment LED countdown. Paddle down cancels the timer and turns the
    fan off. Requires Z-Wave JS and an input timer helper.
  domain: automation
  author: mgarlick / Codex
  source_url: https://raw.githubusercontent.com/Mekle001/home-assistant-blueprints/main/automation/inovelli_red_fan_timer.yaml
  homeassistant:
    min_version: 2024.6.0
  input:
    device_section:
      name: Device
      icon: mdi:fan
      input:
        up_event_entity:
          name: Paddle-up scene entity
          description: Scene 001 event entity from the VZW30-SN.
          selector:
            entity:
              domain: event
        down_event_entity:
          name: Paddle-down scene entity
          description: Scene 002 event entity from the VZW30-SN.
          selector:
            entity:
              domain: event
        fan_load_entity:
          name: Fan load entity
          description: Fan, light, or switch entity used for the VZW30-SN load.
          selector:
            entity:
              domain:
                - fan
                - light
                - switch
        timer_entity:
          name: Timer helper
          description: Timer helper dedicated to this fan.
          selector:
            entity:
              domain: timer
    duration_section:
      name: Timer presets
      icon: mdi:timer-outline
      collapsed: false
      input:
        preset_1_minutes:
          name: Preset 1
          default: 5
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_2_minutes:
          name: Preset 2
          default: 10
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_3_minutes:
          name: Preset 3
          default: 15
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_4_minutes:
          name: Preset 4
          default: 30
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_5_minutes:
          name: Maximum run time
          default: 240
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box

    led_section:
      name: LED countdown
      icon: mdi:led-strip-variant
      input:
        preset_1_color:
          name: Preset 1 color
          default: 85
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_2_color:
          name: Preset 2 color
          default: 127
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_3_color:
          name: Preset 3 color
          default: 42
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_4_color:
          name: Preset 4 color
          default: 21
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_5_color:
          name: Maximum run-time color
          default: 191
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        warning_color:
          name: Final-segment warning color
          default: 0
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        led_intensity:
          name: Countdown intensity
          default: 33
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input up_event_entity
    id: paddle_up
  - platform: state
    entity_id: !input down_event_entity
    id: paddle_down
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input timer_entity
    id: timer_finished

variables:
  up_scene: !input up_event_entity
  fan_load: !input fan_load_entity
  timer: !input timer_entity
  zwave_device: "{{ device_id(up_scene) }}"
  led_parameters: [64, 69, 74, 79, 84, 89, 94]
  preset_minutes:
    - !input preset_1_minutes
    - !input preset_2_minutes
    - !input preset_3_minutes
    - !input preset_4_minutes
    - !input preset_5_minutes
  preset_colors:
    - !input preset_1_color
    - !input preset_2_color
    - !input preset_3_color
    - !input preset_4_color
    - !input preset_5_color
  final_warning_color: !input warning_color
  countdown_intensity: !input led_intensity

action:
  - variables:
      switch_action: >-
        {{ trigger.to_state.attributes.event_type
        if trigger.id in ['paddle_up', 'paddle_down'] and
        trigger.to_state is not none else '' }}

  - choose:
      - conditions: "{{ trigger.id == 'paddle_down' and switch_action == 'KeyPressed' }}"
        sequence:
          - service: timer.cancel
            target:
              entity_id: "{{ timer }}"
          - service: zwave_js.set_config_parameter
            target:
              device_id: "{{ zwave_device }}"
            data:
              parameter: 99
              bitmask: 4278190080
              value: 255
          - delay:
              milliseconds: 500
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ fan_load }}"
          - stop: Fan timer cancelled from the paddle.

      - conditions: "{{ trigger.id == 'timer_finished' }}"
        sequence:
          - service: zwave_js.set_config_parameter
            target:
              device_id: "{{ zwave_device }}"
            data:
              parameter: 99
              bitmask: 4278190080
              value: 255
          - delay:
              milliseconds: 500
          - service: homeassistant.turn_off
            target:
              entity_id: "{{ fan_load }}"
          - stop: Fan timer completed.

      - conditions: >-
          {{ trigger.id in ['paddle_up', 'paddle_down'] and
          switch_action != 'KeyPressed' }}
        sequence:
          - stop: Paddle action is not used by the fan timer.

  - variables:
      current_duration_seconds: >-
        {% if is_state(timer, 'active') or is_state(timer, 'paused') %}
          {{ as_timedelta(state_attr(timer, 'duration')).total_seconds() | int }}
        {% else %}
          0
        {% endif %}
      next_preset_index: >-
        {% if current_duration_seconds | int == 0 %}
          0
        {% else %}
          {% set ns = namespace(index=0, found=false) %}
          {% for minutes in preset_minutes %}
            {% if not ns.found and (minutes | int * 60) == (current_duration_seconds | int) %}
              {% set ns.index = [loop.index, 4] | min %}
              {% set ns.found = true %}
            {% endif %}
          {% endfor %}
          {{ ns.index if ns.found else 0 }}
        {% endif %}

  - variables:
      selected_minutes: "{{ preset_minutes[next_preset_index | int] | int }}"
      selected_color: "{{ preset_colors[next_preset_index | int] | int }}"
      selected_seconds: "{{ selected_minutes | int * 60 }}"
      timer_duration: >-
        {% set seconds = selected_minutes | int * 60 %}
        {{ '%02d:%02d:%02d' | format(seconds // 3600,
        (seconds % 3600) // 60, seconds % 60) }}
      segment_seconds: "{{ (selected_minutes | float * 60 / 7) }}"

  - service: homeassistant.turn_on
    target:
      entity_id: "{{ fan_load }}"

  - service: timer.start
    target:
      entity_id: "{{ timer }}"
    data:
      duration: "{{ timer_duration }}"

  - repeat:
      count: 7
      sequence:
        - service: zwave_js.bulk_set_partial_config_parameters
          target:
            device_id: "{{ zwave_device }}"
          data:
            parameter: "{{ led_parameters[repeat.index - 1] }}"
            value:
              "255": 255
              "65280": "{{ countdown_intensity | int }}"
              "16711680": "{{ selected_color | int }}"
              "4278190080": 1

  - repeat:
      count: 6
      sequence:
        - delay:
            seconds: "{{ segment_seconds | float }}"
        - service: zwave_js.bulk_set_partial_config_parameters
          target:
            device_id: "{{ zwave_device }}"
          data:
            parameter: "{{ led_parameters[7 - repeat.index] }}"
            value:
              "255": 255
              "65280": 0
              "16711680": 0
              "4278190080": 0

  - service: zwave_js.bulk_set_partial_config_parameters
    target:
      device_id: "{{ zwave_device }}"
    data:
      parameter: 64
      value:
        "255": 255
        "65280": "{{ countdown_intensity | int }}"
        "16711680": "{{ final_warning_color | int }}"
        "4278190080": 4

  - delay:
      seconds: "{{ segment_seconds | float }}"

  - service: zwave_js.set_config_parameter
    target:
      device_id: "{{ zwave_device }}"
    data:
      parameter: 99
      bitmask: 4278190080
      value: 255

  - delay:
      milliseconds: 500

  - service: homeassistant.turn_off
    target:
      entity_id: "{{ fan_load }}"
