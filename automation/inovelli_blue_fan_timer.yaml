blueprint:
  name: Inovelli Blue VZM30 Fan Preset Timer
  description: 'Replace the VZM30-SN firmware fan timer with a Home Assistant timer. Each paddle-up press advances
    through five run-time presets and refills a seven-segment LED countdown. Paddle down cancels the timer and turns
    the fan off. Requires Zigbee2MQTT and an input timer helper.


    Optional humidity status: cyan slow-rising full-bar animation at 30% when the automatic ventilation hold is
    on and no preset is active. Preset countdowns take priority. Provide a dedicated restoring input_boolean to
    track LED ownership; this status controller never operates the fan.

    '
  domain: automation
  author: mgarlick / Codex
  source_url: https://raw.githubusercontent.com/Mekle001/home-assistant-blueprints/main/automation/inovelli_blue_fan_timer.yaml
  homeassistant:
    min_version: 2024.6.0
  input:
    device_section:
      name: Device
      icon: mdi:fan
      input:
        switch_device:
          name: Fan switch
          description: Inovelli Blue VZM30-SN device connected to the fan.
          selector:
            device:
              integration: mqtt
              manufacturer: Inovelli
        timer_entity:
          name: Timer helper
          description: Timer helper dedicated to this fan.
          selector:
            entity:
              domain: timer
        zigbee2mqtt_topic:
          name: Zigbee2MQTT topic override
          description: 'Optional full base topic for the switch, such as zigbee2mqtt/Guest Bathroom Fan. Leave blank
            to calculate zigbee2mqtt/<device name> from the selected switch device.

            '
          default: ''
          selector:
            text: null
        automatic_hold_entity:
          name: Automatic ventilation hold
          description: 'Optional helper that keeps the fan running after a preset expires. Paddle down always turns
            it off. An unavailable hold is conservative and must recover to off before preset expiry can turn the
            fan off.

            '
          default: []
          selector:
            entity:
              domain: input_boolean
    duration_section:
      name: Timer presets
      icon: mdi:timer-outline
      collapsed: false
      input:
        preset_1_minutes:
          name: Preset 1
          default: 5
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_2_minutes:
          name: Preset 2
          default: 10
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_3_minutes:
          name: Preset 3
          default: 15
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_4_minutes:
          name: Preset 4
          default: 30
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_5_minutes:
          name: Maximum run time
          default: 240
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
    led_section:
      name: LED countdown
      icon: mdi:led-strip-variant
      input:
        preset_1_color:
          name: Preset 1 color
          default: 85
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_2_color:
          name: Preset 2 color
          default: 127
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_3_color:
          name: Preset 3 color
          default: 42
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_4_color:
          name: Preset 4 color
          default: 21
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_5_color:
          name: Maximum run-time color
          default: 191
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        warning_color:
          name: Final-segment warning color
          default: 0
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        led_intensity:
          name: Countdown intensity
          default: 33
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: '%'
              mode: slider
    humidity_section:
      name: Humidity ventilation indicator
      icon: mdi:water-percent
      collapsed: true
      input:
        humidity_led_enabled:
          name: Show humidity ventilation status
          default: false
          selector:
            boolean: {}
        humidity_led_owned_entity:
          name: LED ownership helper
          default: []
          description: Dedicated restoring input_boolean; internal LED ownership, not a user control.
          selector:
            entity:
              domain:
              - input_boolean
              multiple: false
        humidity_led_color:
          name: Humidity color
          default: 127
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        humidity_led_intensity:
          name: Humidity brightness
          default: 30
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'
mode: restart
max_exceeded: silent
trigger:
- platform: device
  device_id: !input 'switch_device'
  domain: mqtt
  type: action
  subtype: up_single
  id: paddle_up
- platform: device
  device_id: !input 'switch_device'
  domain: mqtt
  type: action
  subtype: down_single
  id: paddle_down
- platform: event
  event_type: timer.finished
  event_data:
    entity_id: !input 'timer_entity'
  id: timer_finished
- platform: template
  value_template: '{{ hold_trigger and is_state(hold_trigger, ''on'') and is_state((device_entities(device_trigger)
    | select(''match'', ''^light[.]'') | first | default('''')), ''on'') }}'
  id: humidity_on
  enabled: !input 'humidity_led_enabled'
- platform: template
  value_template: '{{ hold_trigger and (is_state(hold_trigger, ''off'') or is_state((device_entities(device_trigger)
    | select(''match'', ''^light[.]'') | first | default('''')), ''off'')) }}'
  id: humidity_off
  enabled: !input 'humidity_led_enabled'
- platform: time_pattern
  minutes: /1
  id: humidity_reconcile
  enabled: !input 'humidity_led_enabled'
- platform: homeassistant
  event: start
  id: humidity_restore
  enabled: !input 'humidity_led_enabled'
- platform: event
  event_type: automation_reloaded
  id: humidity_restore
  enabled: !input 'humidity_led_enabled'
variables:
  switch_device_id: !input 'switch_device'
  fan_load: '{{ device_entities(switch_device_id) | select(''match'', ''^light\\.'') | first | default('''', true)
    }}'
  timer: !input 'timer_entity'
  automatic_hold: !input 'automatic_hold_entity'
  configured_mqtt_topic: !input 'zigbee2mqtt_topic'
  mqtt_base_topic: "{% if configured_mqtt_topic | trim %}\n  {{ configured_mqtt_topic | trim | regex_replace('/$',\
    \ '') }}\n{% else %}\n  zigbee2mqtt/{{ device_attr(switch_device_id, 'name') }}\n{% endif %}"
  preset_minutes:
  - !input 'preset_1_minutes'
  - !input 'preset_2_minutes'
  - !input 'preset_3_minutes'
  - !input 'preset_4_minutes'
  - !input 'preset_5_minutes'
  preset_colors:
  - !input 'preset_1_color'
  - !input 'preset_2_color'
  - !input 'preset_3_color'
  - !input 'preset_4_color'
  - !input 'preset_5_color'
  final_warning_color: !input 'warning_color'
  countdown_intensity: !input 'led_intensity'
  humidity_enabled: !input 'humidity_led_enabled'
  humidity_led_owned: !input 'humidity_led_owned_entity'
  humidity_color: !input 'humidity_led_color'
  humidity_intensity: !input 'humidity_led_intensity'
action:
- choose:
  - conditions:
    - condition: trigger
      id:
      - humidity_on
      - humidity_off
      - humidity_reconcile
      - humidity_restore
    sequence:
    - choose:
      - conditions:
        - '{{ humidity_enabled and automatic_hold and humidity_led_owned and is_state(automatic_hold, ''on'') and
          is_state(fan_load, ''on'') and is_state(timer, ''idle'') }}'
        - '{{ is_state(humidity_led_owned, ''off'') or trigger.id in [''humidity_on'', ''humidity_restore''] }}'
        sequence:
        - service: mqtt.publish
          data:
            topic: '{{ mqtt_base_topic }}/set'
            payload: '{{ {''led_effect'': {''effect'': ''clear_effect'', ''color'': 0, ''level'': 0, ''duration'':
              1}} | to_json }}'
        - repeat:
            count: 7
            sequence:
            - service: mqtt.publish
              data:
                topic: '{{ mqtt_base_topic }}/set'
                payload: '{{ {''individual_led_effect'': {''led'': repeat.index, ''effect'': ''clear_effect'', ''color'':
                  0, ''level'': 0, ''duration'': 1}} | to_json }}'
        - service: mqtt.publish
          data:
            topic: '{{ mqtt_base_topic }}/set'
            payload: '{{ {''led_effect'': {''effect'': ''slow_rising'', ''color'': humidity_color | int, ''level'':
              humidity_intensity | int, ''duration'': 255}} | to_json }}'
        - service: input_boolean.turn_on
          target:
            entity_id: '{{ humidity_led_owned }}'
      - conditions:
        - '{{ humidity_led_owned and is_state(humidity_led_owned, ''on'') and is_state(timer, ''idle'') and (not
          is_state(automatic_hold, ''on'') or not is_state(fan_load, ''on'')) }}'
        sequence:
        - service: mqtt.publish
          data:
            topic: '{{ mqtt_base_topic }}/set'
            payload: '{{ {''led_effect'': {''effect'': ''clear_effect'', ''color'': 0, ''level'': 0, ''duration'':
              1}} | to_json }}'
        - service: input_boolean.turn_off
          target:
            entity_id: '{{ humidity_led_owned }}'
    - stop: Humidity status only; fan and preset timer are unchanged.
  - conditions: '{{ trigger.id == ''paddle_down'' }}'
    sequence:
    - alias: Yield the full bar before the preset countdown writes segments
      if: '{{ humidity_enabled and humidity_led_owned }}'
      then:
      - service: mqtt.publish
        data:
          topic: '{{ mqtt_base_topic }}/set'
          payload: '{{ {''led_effect'': {''effect'': ''clear_effect'', ''color'': 0, ''level'': 0, ''duration'':
            1}} | to_json }}'
      - service: input_boolean.turn_off
        target:
          entity_id: '{{ humidity_led_owned }}'
    - service: timer.cancel
      target:
        entity_id: '{{ timer }}'
    - service: mqtt.publish
      data:
        topic: '{{ mqtt_base_topic }}/set'
        payload: '{{ {''led_effect'': {''effect'': ''clear_effect'', ''color'': 0, ''level'': 0, ''duration'': 1}}
          | to_json }}'
    - repeat:
        count: 7
        sequence:
        - service: mqtt.publish
          data:
            topic: '{{ mqtt_base_topic }}/set'
            payload: '{{ {''individual_led_effect'': {''led'': repeat.index, ''effect'': ''clear_effect'', ''color'':
              0, ''level'': 0, ''duration'': 1}} | to_json }}'
    - delay:
        milliseconds: 500
    - service: light.turn_off
      target:
        entity_id: '{{ fan_load }}'
    - stop: Fan timer cancelled from the paddle.
  - conditions: '{{ trigger.id == ''timer_finished'' }}'
    sequence:
    - alias: Yield the full bar before the preset countdown writes segments
      if: '{{ humidity_enabled and humidity_led_owned }}'
      then:
      - service: mqtt.publish
        data:
          topic: '{{ mqtt_base_topic }}/set'
          payload: '{{ {''led_effect'': {''effect'': ''clear_effect'', ''color'': 0, ''level'': 0, ''duration'':
            1}} | to_json }}'
      - service: input_boolean.turn_off
        target:
          entity_id: '{{ humidity_led_owned }}'
    - service: mqtt.publish
      data:
        topic: '{{ mqtt_base_topic }}/set'
        payload: '{{ {''led_effect'': {''effect'': ''clear_effect'', ''color'': 0, ''level'': 0, ''duration'': 1}}
          | to_json }}'
    - repeat:
        count: 7
        sequence:
        - service: mqtt.publish
          data:
            topic: '{{ mqtt_base_topic }}/set'
            payload: '{{ {''individual_led_effect'': {''led'': repeat.index, ''effect'': ''clear_effect'', ''color'':
              0, ''level'': 0, ''duration'': 1}} | to_json }}'
    - delay:
        milliseconds: 500
    - if: '{{ not automatic_hold or is_state(automatic_hold, ''off'') }}'
      then:
      - service: light.turn_off
        target:
          entity_id: '{{ fan_load }}'
      else:
      - if: '{{ humidity_enabled and automatic_hold and humidity_led_owned and is_state(automatic_hold, ''on'')
          and is_state(fan_load, ''on'') and is_state(timer, ''idle'') }}'
        then:
        - service: mqtt.publish
          data:
            topic: '{{ mqtt_base_topic }}/set'
            payload: '{{ {''led_effect'': {''effect'': ''clear_effect'', ''color'': 0, ''level'': 0, ''duration'':
              1}} | to_json }}'
        - repeat:
            count: 7
            sequence:
            - service: mqtt.publish
              data:
                topic: '{{ mqtt_base_topic }}/set'
                payload: '{{ {''individual_led_effect'': {''led'': repeat.index, ''effect'': ''clear_effect'', ''color'':
                  0, ''level'': 0, ''duration'': 1}} | to_json }}'
        - service: mqtt.publish
          data:
            topic: '{{ mqtt_base_topic }}/set'
            payload: '{{ {''led_effect'': {''effect'': ''slow_rising'', ''color'': humidity_color | int, ''level'':
              humidity_intensity | int, ''duration'': 255}} | to_json }}'
        - service: input_boolean.turn_on
          target:
            entity_id: '{{ humidity_led_owned }}'
    - stop: Fan timer completed.
- alias: Yield the full bar before the preset countdown writes segments
  if: '{{ humidity_enabled and humidity_led_owned }}'
  then:
  - service: mqtt.publish
    data:
      topic: '{{ mqtt_base_topic }}/set'
      payload: '{{ {''led_effect'': {''effect'': ''clear_effect'', ''color'': 0, ''level'': 0, ''duration'': 1}}
        | to_json }}'
  - service: input_boolean.turn_off
    target:
      entity_id: '{{ humidity_led_owned }}'
- variables:
    current_duration_seconds: "{% if is_state(timer, 'active') or is_state(timer, 'paused') %}\n  {{ as_timedelta(state_attr(timer,\
      \ 'duration')).total_seconds() | int }}\n{% else %}\n  0\n{% endif %}"
    next_preset_index: "{% if current_duration_seconds | int == 0 %}\n  0\n{% else %}\n  {% set ns = namespace(index=0,\
      \ found=false) %}\n  {% for minutes in preset_minutes %}\n    {% if not ns.found and (minutes | int * 60)\
      \ == (current_duration_seconds | int) %}\n      {% set ns.index = [loop.index, 4] | min %}\n      {% set ns.found\
      \ = true %}\n    {% endif %}\n  {% endfor %}\n  {{ ns.index if ns.found else 0 }}\n{% endif %}"
- variables:
    selected_minutes: '{{ preset_minutes[next_preset_index | int] | int }}'
    selected_color: '{{ preset_colors[next_preset_index | int] | int }}'
    selected_seconds: '{{ selected_minutes | int * 60 }}'
    timer_duration: '{% set seconds = selected_minutes | int * 60 %} {{ ''%02d:%02d:%02d'' | format(seconds // 3600,
      (seconds % 3600) // 60, seconds % 60) }}'
    segment_seconds: '{{ (selected_minutes | float * 60 / 7) }}'
- service: light.turn_on
  target:
    entity_id: '{{ fan_load }}'
- service: timer.start
  target:
    entity_id: '{{ timer }}'
  data:
    duration: '{{ timer_duration }}'
- repeat:
    count: 7
    sequence:
    - service: mqtt.publish
      data:
        topic: '{{ mqtt_base_topic }}/set'
        payload: '{{ {''individual_led_effect'': {''led'': repeat.index, ''effect'': ''solid'', ''color'': selected_color
          | int, ''level'': countdown_intensity | int, ''duration'': 255}} | to_json }}'
- repeat:
    count: 6
    sequence:
    - delay:
        seconds: '{{ segment_seconds | float }}'
    - service: mqtt.publish
      data:
        topic: '{{ mqtt_base_topic }}/set'
        payload: '{{ {''individual_led_effect'': {''led'': 8 - repeat.index, ''effect'': ''off'', ''color'': 0,
          ''level'': 0, ''duration'': 255}} | to_json }}'
- service: mqtt.publish
  data:
    topic: '{{ mqtt_base_topic }}/set'
    payload: '{{ {''individual_led_effect'': {''led'': 1, ''effect'': ''pulse'', ''color'': final_warning_color
      | int, ''level'': countdown_intensity | int, ''duration'': 255}} | to_json }}'
- delay:
    seconds: '{{ segment_seconds | float }}'
- service: mqtt.publish
  data:
    topic: '{{ mqtt_base_topic }}/set'
    payload: '{{ {''led_effect'': {''effect'': ''clear_effect'', ''color'': 0, ''level'': 0, ''duration'': 1}} |
      to_json }}'
- repeat:
    count: 7
    sequence:
    - service: mqtt.publish
      data:
        topic: '{{ mqtt_base_topic }}/set'
        payload: '{{ {''individual_led_effect'': {''led'': repeat.index, ''effect'': ''clear_effect'', ''color'':
          0, ''level'': 0, ''duration'': 1}} | to_json }}'
- delay:
    milliseconds: 500
- if: '{{ not automatic_hold or is_state(automatic_hold, ''off'') }}'
  then:
  - service: light.turn_off
    target:
      entity_id: '{{ fan_load }}'
  else:
  - if: '{{ humidity_enabled and automatic_hold and humidity_led_owned and is_state(automatic_hold, ''on'') and
      is_state(fan_load, ''on'') and is_state(timer, ''idle'') }}'
    then:
    - service: mqtt.publish
      data:
        topic: '{{ mqtt_base_topic }}/set'
        payload: '{{ {''led_effect'': {''effect'': ''clear_effect'', ''color'': 0, ''level'': 0, ''duration'': 1}}
          | to_json }}'
    - repeat:
        count: 7
        sequence:
        - service: mqtt.publish
          data:
            topic: '{{ mqtt_base_topic }}/set'
            payload: '{{ {''individual_led_effect'': {''led'': repeat.index, ''effect'': ''clear_effect'', ''color'':
              0, ''level'': 0, ''duration'': 1}} | to_json }}'
    - service: mqtt.publish
      data:
        topic: '{{ mqtt_base_topic }}/set'
        payload: '{{ {''led_effect'': {''effect'': ''slow_rising'', ''color'': humidity_color | int, ''level'':
          humidity_intensity | int, ''duration'': 255}} | to_json }}'
    - service: input_boolean.turn_on
      target:
        entity_id: '{{ humidity_led_owned }}'
trigger_variables:
  hold_trigger: !input 'automatic_hold_entity'
  device_trigger: !input 'switch_device'
condition:
- '{{ trigger is defined and (trigger.id not in [''humidity_on'', ''humidity_off'', ''humidity_reconcile'', ''humidity_restore'']
  or (humidity_enabled and automatic_hold and humidity_led_owned and is_state(timer, ''idle'') and (this.attributes.current
  | int(0)) == 0)) }}'
