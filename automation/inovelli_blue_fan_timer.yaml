blueprint:
  name: Inovelli Blue VZM30 Fan Preset Timer
  description: >
    Replace the VZM30-SN firmware fan timer with a Home Assistant timer.
    Each paddle-up press advances through five run-time presets and refills a
    seven-segment LED countdown. Paddle down cancels the timer and turns the
    fan off. Requires Zigbee2MQTT and an input timer helper.
  domain: automation
  author: mgarlick / Codex
  source_url: https://raw.githubusercontent.com/Mekle001/home-assistant-blueprints/main/automation/inovelli_blue_fan_timer.yaml
  homeassistant:
    min_version: 2024.6.0
  input:
    device_section:
      name: Device
      icon: mdi:fan
      input:
        action_entity:
          name: Switch action entity
          description: Event entity that reports paddle actions from the VZM30-SN.
          selector:
            entity:
              domain: event
        fan_load_entity:
          name: Fan load entity
          description: Light entity used by Zigbee2MQTT for the VZM30-SN load.
          selector:
            entity:
              domain: light
        timer_entity:
          name: Timer helper
          description: Timer helper dedicated to this fan.
          selector:
            entity:
              domain: timer
        zigbee2mqtt_topic:
          name: Zigbee2MQTT topic override
          description: >
            Optional full base topic for the switch, such as
            zigbee2mqtt/Guest Bathroom Fan. Leave blank to calculate
            zigbee2mqtt/<device name> from the selected action entity.
          default: ""
          selector:
            text:

    duration_section:
      name: Timer presets
      icon: mdi:timer-outline
      collapsed: false
      input:
        preset_1_minutes:
          name: Preset 1
          default: 5
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_2_minutes:
          name: Preset 2
          default: 10
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_3_minutes:
          name: Preset 3
          default: 15
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_4_minutes:
          name: Preset 4
          default: 30
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box
        preset_5_minutes:
          name: Maximum run time
          default: 240
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              unit_of_measurement: min
              mode: box

    led_section:
      name: LED countdown
      icon: mdi:led-strip-variant
      input:
        preset_1_color:
          name: Preset 1 color
          default: 85
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_2_color:
          name: Preset 2 color
          default: 127
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_3_color:
          name: Preset 3 color
          default: 42
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_4_color:
          name: Preset 4 color
          default: 21
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        preset_5_color:
          name: Maximum run-time color
          default: 191
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        warning_color:
          name: Final-segment warning color
          default: 0
          selector:
            number:
              min: 0
              max: 255
              step: 1
              mode: slider
        led_intensity:
          name: Countdown intensity
          default: 33
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input action_entity
    id: switch_action
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input timer_entity
    id: timer_finished

variables:
  action_event: !input action_entity
  fan_load: !input fan_load_entity
  timer: !input timer_entity
  configured_mqtt_topic: !input zigbee2mqtt_topic
  mqtt_base_topic: >-
    {% if configured_mqtt_topic | trim %}
      {{ configured_mqtt_topic | trim | regex_replace('/$', '') }}
    {% else %}
      zigbee2mqtt/{{ device_attr(device_id(action_event), 'name') }}
    {% endif %}
  preset_minutes:
    - !input preset_1_minutes
    - !input preset_2_minutes
    - !input preset_3_minutes
    - !input preset_4_minutes
    - !input preset_5_minutes
  preset_colors:
    - !input preset_1_color
    - !input preset_2_color
    - !input preset_3_color
    - !input preset_4_color
    - !input preset_5_color
  final_warning_color: !input warning_color
  countdown_intensity: !input led_intensity

action:
  - variables:
      switch_action: >-
        {{ trigger.to_state.attributes.event_type
        if trigger.id == 'switch_action' and trigger.to_state is not none
        else '' }}

  - choose:
      - conditions: "{{ trigger.id == 'switch_action' and switch_action == 'down_single' }}"
        sequence:
          - service: timer.cancel
            target:
              entity_id: "{{ timer }}"
          - service: mqtt.publish
            data:
              topic: "{{ mqtt_base_topic }}/set"
              payload: >-
                {{ {'led_effect': {'effect': 'clear_effect', 'color': 0,
                'level': 0, 'duration': 1}} | to_json }}
          - delay:
              milliseconds: 500
          - service: light.turn_off
            target:
              entity_id: "{{ fan_load }}"
          - stop: Fan timer cancelled from the paddle.

      - conditions: "{{ trigger.id == 'timer_finished' }}"
        sequence:
          - service: mqtt.publish
            data:
              topic: "{{ mqtt_base_topic }}/set"
              payload: >-
                {{ {'led_effect': {'effect': 'clear_effect', 'color': 0,
                'level': 0, 'duration': 1}} | to_json }}
          - delay:
              milliseconds: 500
          - service: light.turn_off
            target:
              entity_id: "{{ fan_load }}"
          - stop: Fan timer completed.

      - conditions: >-
          {{ trigger.id == 'switch_action' and
          switch_action not in ['up_single', 'down_single'] }}
        sequence:
          - stop: Paddle action is not used by the fan timer.

  - variables:
      current_duration_seconds: >-
        {% if is_state(timer, 'active') or is_state(timer, 'paused') %}
          {{ as_timedelta(state_attr(timer, 'duration')).total_seconds() | int }}
        {% else %}
          0
        {% endif %}
      next_preset_index: >-
        {% if current_duration_seconds | int == 0 %}
          0
        {% else %}
          {% set ns = namespace(index=0, found=false) %}
          {% for minutes in preset_minutes %}
            {% if not ns.found and (minutes | int * 60) == (current_duration_seconds | int) %}
              {% set ns.index = [loop.index, 4] | min %}
              {% set ns.found = true %}
            {% endif %}
          {% endfor %}
          {{ ns.index if ns.found else 0 }}
        {% endif %}

  - variables:
      selected_minutes: "{{ preset_minutes[next_preset_index | int] | int }}"
      selected_color: "{{ preset_colors[next_preset_index | int] | int }}"
      selected_seconds: "{{ selected_minutes | int * 60 }}"
      timer_duration: >-
        {% set seconds = selected_minutes | int * 60 %}
        {{ '%02d:%02d:%02d' | format(seconds // 3600,
        (seconds % 3600) // 60, seconds % 60) }}
      segment_seconds: "{{ (selected_minutes | float * 60 / 7) }}"

  - service: light.turn_on
    target:
      entity_id: "{{ fan_load }}"

  - service: timer.start
    target:
      entity_id: "{{ timer }}"
    data:
      duration: "{{ timer_duration }}"

  - repeat:
      count: 7
      sequence:
        - service: mqtt.publish
          data:
            topic: "{{ mqtt_base_topic }}/set"
            payload: >-
              {{ {'individual_led_effect': {'led': repeat.index,
              'effect': 'solid', 'color': selected_color | int,
              'level': countdown_intensity | int, 'duration': 255}} | to_json }}

  - repeat:
      count: 6
      sequence:
        - delay:
            seconds: "{{ segment_seconds | float }}"
        - service: mqtt.publish
          data:
            topic: "{{ mqtt_base_topic }}/set"
            payload: >-
              {{ {'individual_led_effect': {'led': 8 - repeat.index,
              'effect': 'off', 'color': 0, 'level': 0,
              'duration': 255}} | to_json }}

  - service: mqtt.publish
    data:
      topic: "{{ mqtt_base_topic }}/set"
      payload: >-
        {{ {'individual_led_effect': {'led': 1, 'effect': 'pulse',
        'color': final_warning_color | int, 'level': countdown_intensity | int,
        'duration': 255}} | to_json }}

  - delay:
      seconds: "{{ segment_seconds | float }}"

  - service: mqtt.publish
    data:
      topic: "{{ mqtt_base_topic }}/set"
      payload: >-
        {{ {'led_effect': {'effect': 'clear_effect', 'color': 0,
        'level': 0, 'duration': 1}} | to_json }}

  - delay:
      milliseconds: 500

  - service: light.turn_off
    target:
      entity_id: "{{ fan_load }}"
